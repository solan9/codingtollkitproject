services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: trustnews
      POSTGRES_USER: trustnews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustnews -d trustnews"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://trustnews:${POSTGRES_PASSWORD:-change-this-password}@db:5432/trustnews
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-deploy}
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      NEWS_API_URL: ${NEWS_API_URL:-https://newsapi.org/v2}
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
